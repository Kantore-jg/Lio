<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Présentez votre projet ou posez une question à Lio.">
  <title>Contact | Lio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <header class="site-header" id="accueil">
    <div class="container header-inner">
      <a class="logo" href="index.html" aria-label="Lio, accueil">lio<span>.</span></a>
      <nav aria-label="Navigation principale">
        <a href="home.html">Accueil</a>
        <a href="services.html">Services</a>
        <a href="articles.html">Articles</a>
        <a href="portfolio.html">Portfolio</a>
        <a class="button button-outline" href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main id="contenu">
    <section class="container contact-page" aria-labelledby="titre-contact">
      <div class="page-intro">
        <h1 id="titre-contact">Contact</h1>
        <p>Décrivez votre projet ou indiquez le service qui vous intéresse.</p>
      </div>

      <!-- Remplacez l’adresse d’exemple dans l’action du formulaire. -->
      <form class="service-card contact-form" action="mailto:contact@example.com?subject=Demande%20de%20contact%20Lio" method="post" enctype="text/plain" aria-describedby="aide-contact">
        <p id="aide-contact">Tous les champs sont obligatoires. Le bouton ouvre votre application de messagerie pour relire et envoyer le message.</p>
        <div class="form-field">
          <label for="nom">Nom complet</label>
          <input id="nom" name="Nom" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="Email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="sujet">Sujet</label>
          <input id="sujet" name="Sujet" required>
        </div>
        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="Message" rows="6" required></textarea>
        </div>
        <button class="button button-primary" type="submit">Ouvrir le brouillon d’e-mail</button>
      </form>
    </section>
  </main>

  <footer class="container site-footer">
    <a class="logo" href="index.html" aria-label="Lio, retour à l’accueil">lio<span>.</span></a>
    <small>© Lio</small>
    <a href="#accueil">Retour en haut</a>
  </footer>
</body>
</html>
